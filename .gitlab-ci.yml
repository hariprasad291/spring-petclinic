stages:
  - code_scan
  - build
  - docker
  - deploy
  - rollback

variables:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: spring-petclinic
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  EKS_CLUSTER: my-eks-cluster
  HELM_RELEASE: spring-petclinic
  NAMESPACE: dev

