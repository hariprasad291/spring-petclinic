build:
  stage: build
  image: maven:3.9.4-eclipse-temurin-17
  script:
    - ./mvnw package -DskipTests
  artifacts:
    paths:
      - target/*.jar

docker:
  stage: docker
  image: docker:stable
  services:
    - name: docker:dind
      entrypoint: ["env", "-u", "DOCKER_HOST"]
      command: ["dockerd-entrypoint.sh"]
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  dependencies:
    - build
  before_script:
    - apk update && apk add --no-cache curl python3 py3-pip aws-cli bash jq
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
    - export TRIVY_VERSION=$(wget -qO - "https://api.github.com/repos/aquasecurity/trivy/releases/latest" | grep '"tag_name":' | sed -E 's/.*"v([^"]+)".*/\1/')
    - echo $TRIVY_VERSION
    - wget --no-verbose https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz -O - | tar -zxvf -
  script:
    - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
    #- docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    - docker run -d --name petclinic $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
    - ./trivy fs --container petclinic --exit-code 0 --severity HIGH,CRITICAL
  #   - ./trivy image --exit-code 0 --format template --template "@contrib/gitlab-codequality.tpl" -o gl-codeclimate-image.json $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
  #   # Filesystem report
  #   - ./trivy filesystem --scanners misconfig,vuln --exit-code 0 --format template --template "@contrib/gitlab-codequality.tpl" -o gl-codeclimate-fs.json .
  #   #Secrets scanning
  #   - ./trivy filesystem --scanners secret --exit-code 0 --format template --template "@contrib/gitlab-codequality.tpl" -o gl-codeclimate-fs-secrets.json .
  #   # Combine report
  #   - jq -s 'add' gl-codeclimate-image.json gl-codeclimate-fs.json gl-codeclimate-fs-secrets.json > gl-codeclimate.json
