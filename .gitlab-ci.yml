  #   paths:
  #     - .trivycache/
  # # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  # artifacts:
  #   paths:
  #     - gl-codeclimate.json

deploy:
  stage: deploy
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y curl unzip openssl bash
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip && ./aws/install
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script: 
    - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER
    - helm upgrade --install "$HELM_RELEASE" ./helm/spring-petclinic-chart --namespace "$NAMESPACE" --create-namespace --set image.repository="$ECR_REGISTRY/$ECR_REPOSITORY" --set image.tag="$IMAGE_TAG"
    #- kubectl rollout status deployment/$HELM_RELEASE --namespace $NAMESPACE --timeout=60s

rollback:
  stage: rollback
  image: ubuntu:22.04
  before_script:
    - apt update && apt install -y curl unzip openssl bash jq
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip awscliv2.zip && ./aws/install
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script: 
    - echo "Rolling back to last successful Helm release Version for the release $HELM_RELEASE"
    - aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER
    - PREV_REV=$(helm history $HELM_RELEASE --namespace $NAMESPACE -o json | jq '[.[] | select(.status == "deployed")][length-2].revision')
    - echo "Rolling backt to revision $PREV_REV"
    - helm rollback $HELM_RELEASE $PREV_REV --namespace $NAMESPACE
    - kubectl rollout status deployment/$HELM_RELEASE --namespace $NAMESPACE --timeout=60s
  when: on_failure
  allow_failure: true
  needs: ["deploy"]
